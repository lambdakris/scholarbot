[project]
name = "scholarbot"
version = "0.1.0"
description = "A Deep Research agent with benchmark-driven, self-improving architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "claude-agent-sdk>=0.1.0",
    "datasets>=4.8.4",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.0",
    "jupyter>=1.1.1",
    "mlflow>=3.11.1",
    "python-dotenv>=1.2.1",
    "streamlit>=1.40.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.0",
    "jupyterlab>=4.0.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
