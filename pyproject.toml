[project]
name = "scholarbot"
version = "0.1.0"
description = "A Deep Research agent with benchmark-driven, self-improving architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "claude-agent-sdk>=0.1.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.0",
    "mlflow>=3.0.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.40.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]
